name: Unity package validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-tests:
    name: Unity ${{ matrix.unity }} / ${{ matrix.setup }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {unity: 6000.0.0f1, setup: Clean}
          - {unity: 6000.0.0f1, setup: Encrypted}
          - {unity: 6000.6.5f1, setup: Clean}
          - {unity: 6000.6.5f1, setup: PlainText}
          - {unity: 6000.6.5f1, setup: Binary}
          - {unity: 6000.6.5f1, setup: Encrypted}
    steps:
      - uses: actions/checkout@v4
      - name: Create clean consumer project
        shell: pwsh
        run: |
          $arguments = @{
            Destination = (Join-Path $env:GITHUB_WORKSPACE "ValidationHost")
            UnityVersion = "${{ matrix.unity }}"
            IncludeGeneratedExamples = ("${{ matrix.setup }}" -ne "Clean")
          }
          if ("${{ matrix.setup }}" -ne "Clean") { $arguments.SetupFormat = "${{ matrix.setup }}" }
          .\.github\scripts\New-UnityValidationHost.ps1 @arguments
      - name: Check license configuration
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Configure Unity license secrets before running this workflow. See README validation section."
            exit 1
          fi
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ValidationHost
          unityVersion: ${{ matrix.unity }}
          testMode: editmode
          artifactsPath: artifacts
      - name: Require actual passing tests
        if: always()
        shell: pwsh
        run: |
          $results = @(Get-ChildItem artifacts -Recurse -Filter "*.xml" -ErrorAction SilentlyContinue)
          $runs = @($results | ForEach-Object { [xml]$xml = Get-Content $_.FullName; if ($xml.'test-run') { $xml.'test-run' } })
          if ($runs.Count -eq 0) { throw "No NUnit test-run result was produced." }
          foreach ($run in $runs) {
            if ([int]$run.total -lt 1 -or [int]$run.passed -lt 1 -or [int]$run.failed -gt 0) {
              throw "Unity tests did not pass: $($run.result), total $($run.total), failed $($run.failed)."
            }
            if ("${{ matrix.setup }}" -eq "Clean") {
              if ([int]$run.skipped -gt 0 -or $run.result -notlike "Passed*") {
                throw "Clean consumer validation must pass without skipped tests: $($run.result), skipped $($run.skipped)."
              }
            }
            elseif ($run.result -notlike "Passed*" -and $run.result -ne "Skipped:Ignored") {
              throw "Unexpected generated-consumer result: $($run.result)."
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-${{ matrix.unity }}-${{ matrix.setup }}-results
          path: artifacts
          if-no-files-found: error
